name: Hardened stock-control evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate retained StarCoder2 control in the hardened container
        env:
          EVALPLUS_CPUS: "4"
        run: >-
          bash scripts/evaluate_in_docker.sh
          artifacts/controls/stock-evalplus/stock-evalplus-starcoder2-3b.jsonl
      - name: Upload evaluator outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-starcoder2-evalplus-results
          if-no-files-found: error
          path: |
            artifacts/controls/stock-evalplus/*_eval_results.json
            artifacts/controls/stock-evalplus/evaluator-image.txt
          retention-days: 30
