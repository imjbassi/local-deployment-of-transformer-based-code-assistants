name: Hardened StarCoder2 stop ablation evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate retained stop-rule ablation in the hardened container
        env:
          EVALPLUS_CPUS: "4"
        run: >-
          bash scripts/evaluate_in_docker.sh
          artifacts/controls/stop-ablation/starcoder2-no-new-def-stop.jsonl
      - name: Upload evaluator outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starcoder2-stop-ablation-evalplus-results
          if-no-files-found: error
          path: |
            artifacts/controls/stop-ablation/*_eval_results.json
            artifacts/controls/stop-ablation/evaluator-image.txt
          retention-days: 30
