name: Hardened prompt-newline ablation evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate retained prompt-newline ablation in the hardened container
        env:
          EVALPLUS_CPUS: "4"
        run: |
          for samples in artifacts/controls/prompt-newline-ablation/*-no-trailing-newline.jsonl; do
            case "$samples" in *.raw.jsonl) continue ;; esac
            bash scripts/evaluate_in_docker.sh "$samples"
          done
      - name: Upload evaluator outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prompt-newline-ablation-evalplus-results
          if-no-files-found: error
          path: |
            artifacts/controls/prompt-newline-ablation/*_eval_results.json
            artifacts/controls/prompt-newline-ablation/evaluator-image.txt
          retention-days: 30
